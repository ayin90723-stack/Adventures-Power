modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
# displayName 保持英文硬编码：gradle.properties 的 mod_name（中文）经 Gradle expand 时
# 以 ISO-8859-1 读取会 mojibake 双编码乱码（实测 jar 内 displayName 乱码），
# 中文展示名由 lang 键 / 描述承担
displayName="Adventure's Power"
authors="ayin90723-stack"
description='''Adventure's Power — 冒险的力量。以冒险旅程驱动成长的 Minecraft 模组。
经历 10 个里程碑，解锁 30 种内在能力。力量属于冒险者自身，而非装备。'''
logoFile="logo.png"

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="curios"
    mandatory=true
    versionRange="[5.14,)"
    ordering="NONE"
    side="BOTH"
